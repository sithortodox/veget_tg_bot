# Инфраструктура для разработки: PostgreSQL с PostGIS + Redis
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ovoshnoy
      POSTGRES_PASSWORD: ovoshnoy
      POSTGRES_DB: ovoshnoy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Инициализация схемы при первом старте контейнера
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovoshnoy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
